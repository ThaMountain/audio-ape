name: Android CI

on:
  pull_request:
  push:
    branches: [main, "aa/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Run Android lint
        run: ./gradlew :app:lintDebug

      - name: Run unit tests (ALL modules)
        run: |
          ./gradlew \
            :core:model:test \
            :core:database:testDebugUnitTest \
            :core:download:test \
            :core:storage:testDebugUnitTest \
            :plugin:protocol:test \
            :plugin:fixtures:test \
            :plugin:host:testDebugUnitTest \
            :app:testDebugUnitTest

      - name: Upload unit test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: audio-ape-unit-test-reports
          if-no-files-found: ignore
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: audio-ape-debug-evidence
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
